        { part: "A", question: "You command the robot to track a trajectory passing through a singular configuration at constant endpoint speed. What happens to the joint velocities?", options: ["They stay constant", "They become zero", "They tend to infinity", "They become negative"], answer: "C" },
        { part: "A", question: "In Step 4 you sketch the singular posture at θ3 = 0. What is the arm's shape?", options: ["Fully extended straight", "Fully folded", "L-shaped", "U-shaped"], answer: "A" },
        { part: "A", question: "What is the arm's shape at θ3 = 180°?", options: ["Fully extended", "Folded (contracted)", "L-shaped", "Straight"], answer: "B" },

        { part: "A", question: "You solve det(J) = 0. J1 always remains independent (azimuthal). The singularity condition effectively reduces to the determinant of which submatrix?", options: ["J1 and J2", "J2 and J3", "J1 and J3", "None"], answer: "B" },
        { part: "A", question: "At θ3 = 0, which endpoint velocity directions remain possible?", options: ["Azimuthal only", "Azimuthal and along the links (radial)", "Vertical only", "None"], answer: "B" },
        { part: "A", question: "At θ3 = 180°, azimuthal and radial motions are possible, but one direction is not. Which one?", options: ["Azimuthal", "Radial", "Vertical-plane direction perpendicular to the links", "Along the links"], answer: "C" },
        { part: "A", question: "You immobilize Joints 1 and 2 and rotate Joint 3 at unit velocity. The resulting column vector J3 represents what?", options: ["The endpoint velocity per unit Joint 3 velocity with other joints fixed", "The joint torque", "The link length", "The gravity vector"], answer: "A" },
        { part: "A", question: "You immobilize all joints except Joint 1 and rotate it at unit velocity. J1 represents what?", options: ["Endpoint velocity per unit Joint 1 velocity with other joints fixed", "The base reaction force", "The link mass", "The Z-axis position"], answer: "A" },

        { part: "B", question: "What is the determinant of the Jacobian at θ3 = 180°?", options: ["0", "1", "∞", "−1"], answer: "A" },
        { part: "B", question: "What is the determinant of the Jacobian at θ3 = 90°?", options: ["Nonzero (proportional to sin 90° = 1)", "0", "∞", "−1"], answer: "A" },
        { part: "B", question: "What is the formula for det(J) for this arm?", options: ["Proportional to sin θ3", "Proportional to cos θ3", "Proportional to tan θ3", "Proportional to θ3"], answer: "A" },
        { part: "B", question: "At θ3 = 0, J2 and J3 are:", options: ["Parallel", "Perpendicular", "Opposite", "Zero"], answer: "A" },
        { part: "B", question: "At θ3 = 180°, J2 and J3 are:", options: ["Collinear", "Perpendicular", "Zero", "Skew"], answer: "A" },
        { part: "B", question: "At θ3 = 90°, J2 and J3 are:", options: ["Perpendicular", "Parallel", "Collinear", "Zero"], answer: "A" },
        { part: "B", question: "What does the Jacobian matrix relate?", options: ["Joint velocities to endpoint velocities", "Joint torques to endpoint forces", "Joint positions to endpoint positions", "Joint accelerations to endpoint accelerations"], answer: "A" },
        { part: "B", question: "What is the dimension of the Jacobian for a 3-DOF arm in 3D space?", options: ["3×3", "2×2", "3×2", "2×3"], answer: "A" },
        { part: "B", question: "What is the dimension of the endpoint velocity vector?", options: ["3×1", "2×1", "1×1", "3×3"], answer: "A" },
        { part: "B", question: "What is the dimension of the joint velocity vector?", options: ["3×1", "2×1", "1×1", "3×3"], answer: "A" },
        { part: "B", question: "What is the relationship between joint velocities and endpoint velocity?", options: ["v = J q̇", "v = J⁻¹ q̇", "v = Jᵀ q̇", "v = q̇ J"], answer: "A" },
        { part: "B", question: "What is the relationship between joint velocities and endpoint velocity at a non-singular posture?", options: ["q̇ = J⁻¹ v", "q̇ = J v", "q̇ = Jᵀ v", "q̇ = v J"], answer: "A" },
        { part: "B", question: "What happens to q̇ = J⁻¹ v at singularity?", options: ["J⁻¹ does not exist, so q̇ blows up", "J⁻¹ exists, so q̇ is finite", "q̇ = 0", "q̇ = v"], answer: "A" },
        { part: "B", question: "What is the name of the control scheme that uses q̇ = J⁻¹ v?", options: ["Resolved motion rate control", "Inverse kinematics", "Force control", "Impedance control"], answer: "A" },
        { part: "B", question: "Who is credited with resolved motion rate control?", options: ["Daniel Whitney", "Isaac Newton", "Joseph Lagrange", "Leonhard Euler"], answer: "A" },
        { part: "B", question: "What is the null space of the Jacobian?", options: ["The set of joint velocities that produce no endpoint motion", "The set of endpoint velocities that cannot be produced", "The set of all joint velocities", "The set of all endpoint velocities"], answer: "A" },
        { part: "B", question: "What is the range space of the Jacobian?", options: ["The set of all producible endpoint velocities", "The set of joint velocities that produce no endpoint motion", "The set of all joint velocities", "The set of all endpoint velocities"], answer: "A" },
        { part: "B", question: "What is the dimension of the null space for a 3×3 full-rank Jacobian?", options: ["0", "1", "2", "3"], answer: "A" },
        { part: "B", question: "What is the dimension of the null space for a 3×3 rank-2 Jacobian?", options: ["1", "0", "2", "3"], answer: "A" },
        { part: "B", question: "What is the dimension of the range space for a 3×3 rank-2 Jacobian?", options: ["2", "3", "1", "0"], answer: "A" },
        { part: "B", question: "What is the sum of the dimensions of the range space and null space?", options: ["3 (the number of joints)", "2", "1", "0"], answer: "A" },
        { part: "B", question: "What is the singular configuration at θ3 = 0 called?", options: ["Outer boundary singularity", "Inner boundary singularity", "Base singularity", "No singularity"], answer: "A" },
        { part: "B", question: "What is the singular configuration at θ3 = 180° called?", options: ["Inner boundary singularity", "Outer boundary singularity", "Base singularity", "No singularity"], answer: "A" },
        { part: "B", question: "Why is θ3 = 0 at the outer boundary?", options: ["The arm is fully extended, reaching maximum distance", "The arm is fully folded, reaching minimum distance", "The arm is at the center", "The arm is at the base"], answer: "A" },
        { part: "B", question: "Why is θ3 = 180° at the inner boundary?", options: ["The arm is fully folded, reaching minimum distance", "The arm is fully extended, reaching maximum distance", "The arm is at the center", "The arm is at the base"], answer: "A" },
        { part: "B", question: "What is the physical meaning of the blocked direction at singularity?", options: ["The endpoint cannot move in that direction with non-zero velocity", "The endpoint can move in all directions", "The endpoint cannot move at all", "The endpoint moves infinitely fast"], answer: "A" },
        { part: "B", question: "At θ3 = 0, the blocked direction is perpendicular to the links. What motion does this correspond to?", options: ["Bending the elbow further", "Rotating the base", "Sliding along the link", "Rotating about the link axis"], answer: "A" },
        { part: "B", question: "At θ3 = 180°, the blocked direction is perpendicular to the links. What motion does this correspond to?", options: ["Unfolding the elbow", "Rotating the base", "Sliding along the link", "Rotating about the link axis"], answer: "A" },
        { part: "B", question: "Which joint is responsible for the azimuthal direction?", options: ["Joint 1", "Joint 2", "Joint 3", "None"], answer: "A" },
        { part: "B", question: "Which joints are responsible for the radial direction?", options: ["Joints 2 and 3", "Joint 1 only", "Joint 1 and 2", "None"], answer: "A" },
        { part: "B", question: "At θ3 = 0, which joints are collinear in their effect?", options: ["Joints 2 and 3", "Joints 1 and 2", "Joints 1 and 3", "All three"], answer: "A" },
        { part: "B", question: "At θ3 = 180°, which joints are collinear in their effect?", options: ["Joints 2 and 3", "Joints 1 and 2", "Joints 1 and 3", "All three"], answer: "A" },
        { part: "B", question: "What is the dimension of the singular set in joint space?", options: ["2", "1", "0", "3"], answer: "A" },
        { part: "B", question: "What is the dimension of the singular set in the workspace?", options: ["2", "1", "0", "3"], answer: "A" },
        { part: "B", question: "What is the main consequence of a singularity for control?", options: ["The Jacobian inverse does not exist, so resolved-rate control fails", "The robot moves faster", "The robot moves slower", "The robot stops working completely"], answer: "A" },
        { part: "B", question: "How can singularities be avoided?", options: ["By planning trajectories that keep θ3 away from 0 and 180°", "By increasing joint velocities", "By locking Joint 1", "By ignoring them"], answer: "A" }
    ];

    // ------------------------------------------------------------------
    // 2. STATE & RENDERING
    // ------------------------------------------------------------------
    let questions = [];          // array of question objects after shuffle
    let userAnswers = {};        // key: questionIndex -> { selected: 'A'..'D', correct: 'A'..'D' }
    let correctCount = 0;
    let incorrectCount = 0;

    const quizContainer = document.getElementById('quizContainer');
    const correctSpan = document.getElementById('correctCount');
    const incorrectSpan = document.getElementById('incorrectCount');
    const totalSpan = document.getElementById('totalCount');

    // helper: deep clone
    function cloneData(data) {
        return data.map(q => ({
            part: q.part,
            question: q.question,
            options: [...q.options],
            answer: q.answer
        }));
    }

    // shuffle array in place (Fisher–Yates)
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // create a shuffled version: shuffle question order + shuffle options within each question
    // IMPORTANT: keep answer letter consistent with new option positions
    function buildShuffledQuestions() {
        const cloned = cloneData(rawData);

        // shuffle question order
        shuffleArray(cloned);

        // for each question, shuffle options and update answer letter
        for (let q of cloned) {
            const oldAnswer = q.answer;                 // 'A','B','C','D'
            const oldOptions = [...q.options];
            // build list of option objects
            let optObjects = oldOptions.map((text, idx) => ({
                text: text,
                letter: String.fromCharCode(65 + idx)   // 'A','B','C','D'
            }));
            // shuffle
            shuffleArray(optObjects);
            // find where oldAnswer is now
            const newAnswerObj = optObjects.find(o => o.letter === oldAnswer);
            // rebuild q.options in new order, and set new answer letter
            q.options = optObjects.map(o => o.text);
            const newIndex = optObjects.indexOf(newAnswerObj);
            q.answer = String.fromCharCode(65 + newIndex);   // 'A','B','C','D'
        }
        return cloned;
    }

    // full reset: build fresh shuffled questions, clear answers, re-render
    function resetAndShuffle() {
        questions = buildShuffledQuestions();
        userAnswers = {};
        correctCount = 0;
        incorrectCount = 0;
        updateStats();
        renderAll();
    }

    // initial (non-shuffled) load – we still use buildShuffledQuestions? 
    // For first load, we want original order to preserve Part A then Part B.
    // Let's use original order but still shuffle options within each question? 
    // The user said "aik dafa sary hony ky bad inky options or khud mcqs bhi swap ho jain" 
    // => after finishing, shuffle BOTH. First load should be original order, original options.
    // We'll build initial questions as deep clone of rawData (no shuffle).
    function buildInitialQuestions() {
        return cloneData(rawData);
    }

    // render all question cards
    function renderAll() {
        let html = '';
        let currentPart = '';

        questions.forEach((q, idx) => {
            if (q.part !== currentPart) {
                currentPart = q.part;
                html += `<div class="section-label">${currentPart === 'A' ? 'PART A : Scenario‑Based MCQs' : 'PART B : Simple MCQs'}</div>`;
            }

            const ua = userAnswers[idx];   // may be undefined
            const selectedLetter = ua ? ua.selected : null;
            const isCorrect = ua ? (selectedLetter === q.answer) : null;

            // extra classes for card
            let cardClass = 'question-card';
            if (ua) {
                cardClass += isCorrect ? ' correct-highlight' : ' incorrect-highlight';
            }

            // build options
            let optionsHtml = '';
            q.options.forEach((optText, optIdx) => {
                const letter = String.fromCharCode(65 + optIdx);
                let optClass = 'option';

                if (ua) {
                    if (letter === q.answer) optClass += ' correct-option';
                    else if (letter === selectedLetter) optClass += ' incorrect-option';
                    else if (letter === selectedLetter && letter !== q.answer) optClass += ' incorrect-option';
                }

                const letterSpan = `<span class="option-letter">${letter}</span>`;
                const textSpan = `<span>${optText}</span>`;
                optionsHtml += `<div class="${optClass}" data-qidx="${idx}" data-letter="${letter}">${letterSpan}${textSpan}</div>`;
            });

            // feedback area
            let feedbackHtml = '';
            if (ua) {
                if (isCorrect) {
                    feedbackHtml = `<div class="feedback correct">✅ Correct! <span class="explain"></span></div>`;
                } else {
                    feedbackHtml = `<div class="feedback incorrect">❌ Incorrect. Correct answer: ${q.answer}. <span class="explain"></span></div>`;
                }
            } else {
                feedbackHtml = `<div class="feedback" style="visibility:hidden;">&nbsp;</div>`;
            }

            html += `
                <div class="${cardClass}" id="qcard-${idx}">
                    <div class="q-header">
                        <div class="q-num">${idx + 1}</div>
                        <div class="q-text">${q.question}</div>
                    </div>
                    <div class="options" id="options-${idx}">
                        ${optionsHtml}
                    </div>
                    ${feedbackHtml}
                </div>
            `;
        });

        quizContainer.innerHTML = html;

        // attach click listeners to options
        document.querySelectorAll('.option').forEach(optDiv => {
            optDiv.addEventListener('click', function(e) {
                const qIdx = parseInt(this.dataset.qidx, 10);
                const letter = this.dataset.letter;
                handleOptionSelect(qIdx, letter);
            });
        });
    }

    // handle selection
    function handleOptionSelect(qIdx, letter) {
        // if already answered, ignore
        if (userAnswers[qIdx]) return;

        const q = questions[qIdx];
        const isCorrect = (letter === q.answer);

        // store
        userAnswers[qIdx] = {
            selected: letter,
            correct: q.answer
        };

        if (isCorrect) correctCount++;
        else incorrectCount++;

        updateStats();

        // re-render just that question card for simplicity (or re-render all? we re-render all to keep simple)
        // but re-rendering all resets listeners; fine.
        renderAll();
    }

    function updateStats() {
        correctSpan.textContent = `✅ ${correctCount}`;
        incorrectSpan.textContent = `❌ ${incorrectCount}`;
        totalSpan.textContent = `📋 ${questions.length}`;
    }

    // ------------------------------------------------------------------
    // 3. INITIALISE & SHUFFLE BUTTON
    // ------------------------------------------------------------------
    // first load: original order, original options
    questions = buildInitialQuestions();
    userAnswers = {};
    correctCount = 0;
    incorrectCount = 0;
    updateStats();
    renderAll();

    document.getElementById('shuffleBtn').addEventListener('click', function() {
        resetAndShuffle();
    });

    // also if user wants to reset without shuffle? not needed.
    // but we can add a small note: shuffle also clears answers.
    // That's fine.

</script>
